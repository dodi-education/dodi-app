# dodi feature manifest: which user-facing features exist on which client.
#
# Every web route and every mobile screen belongs to a feature here, and every
# feature states its status per client. `pnpm parity:check` enforces this (see
# scripts/parity-check.ts), so a feature can't land on one client without a
# conscious decision about the other.
#
# Status per client:
#   done         shipped; every listed path must exist
#   planned      not there yet; needs `phase` (the roadmap phase) or `notes`
#   n/a          deliberately not on this client; needs `notes` saying why
#   mobile-only  (mobile field only) a native capability the web can't offer
#
# Fields: id, area, title, web, mobile, phase?, core?, web_paths?, mobile_paths?, notes?
# Paths are relative to dodi-app/. `core` lists the shared packages carrying
# the logic, which is where the logic belongs (clients hold UI + adapters).
#
# Mobile roadmap phases (see the mobile plan): 2 = scaffold, auth, vault,
# parent shell, settings; 3 = Game Studio, background builds, games + play;
# 4 = kid view, friends, snapshots, personas, kids; 5 = voice + 3D; 6 = hardening.

features:
  # ----- Auth & setup ---------------------------------------------------------
  - id: auth.login
    area: auth
    title: Sign in (email + password, email code)
    web: done
    mobile: done
    core: [protocol]
    web_paths: ["clients/web/src/app/(auth)/login/page.tsx"]
    mobile_paths:
      - "clients/mobile/src/app/(auth)/login.tsx"
      - "clients/mobile/src/app/index.tsx"
      - "clients/mobile/src/app/(auth)/_layout.tsx"

  - id: auth.register
    area: auth
    title: Register, with the vault sealed until the emailed code confirms
    web: done
    mobile: done
    core: [client-state, vault]
    web_paths:
      - "clients/web/src/app/(auth)/register/page.tsx"
      - "clients/web/src/app/(auth)/finish-setup/page.tsx"
    mobile_paths:
      - "clients/mobile/src/app/(auth)/register.tsx"
      - "clients/mobile/src/app/finish-setup.tsx"

  - id: auth.password-reset
    area: auth
    title: Forgot / change password (nsec-verified vault re-wrap)
    web: done
    mobile: done
    core: [client-state, vault]
    web_paths:
      - "clients/web/src/app/(auth)/reset-password/page.tsx"
      - "clients/web/src/app/(auth)/update-password/page.tsx"
    mobile_paths:
      - "clients/mobile/src/app/(auth)/reset-password.tsx"
      - "clients/mobile/src/app/(auth)/update-password.tsx"

  - id: setup.onboarding
    area: setup
    title: First-run onboarding
    web: done
    mobile: done
    web_paths: ["clients/web/src/app/onboarding/page.tsx"]
    mobile_paths:
      - "clients/mobile/src/app/onboarding.tsx"

  - id: setup.vault
    area: setup
    title: Vault setup and the one-time account key (nsec)
    web: done
    mobile: done
    core: [client-state, vault, crypto]
    web_paths: ["clients/web/src/app/vault-setup/page.tsx"]

  # ----- Parent area ----------------------------------------------------------
    mobile_paths:
      - "clients/mobile/src/app/vault-setup.tsx"
      - "clients/mobile/src/components/vault/vault-gate.tsx"

  - id: parent.dashboard
    area: parent
    title: Parent dashboard
    web: done
    mobile: done
    web_paths: ["clients/web/src/app/parent/dashboard/page.tsx"]
    mobile_paths:
      - "clients/mobile/src/app/parent/dashboard.tsx"
      - "clients/mobile/src/app/parent/_layout.tsx"

  - id: parent.pin-gate
    area: parent
    title: Optional parent PIN in front of the parent area
    web: done
    mobile: done
    core: [client-state]
    web_paths: ["clients/web/src/components/parent/parent-pin-gate.tsx"]
    mobile_paths:
      - "clients/mobile/src/components/parent/parent-pin-gate.tsx"

  - id: parent.kids
    area: parent
    title: Kid profiles (list, create, edit)
    web: done
    mobile: done
    core: [client-state, vault]
    web_paths:
      - "clients/web/src/app/parent/kids/page.tsx"
      - "clients/web/src/app/parent/kids/new/page.tsx"
      - "clients/web/src/app/parent/kids/[id]/page.tsx"
    mobile_paths:
      - "clients/mobile/src/app/parent/kids/index.tsx"
      - "clients/mobile/src/app/parent/kids/new.tsx"
      - "clients/mobile/src/app/parent/kids/[id]/index.tsx"

  - id: parent.kid-memory
    area: parent
    title: Kid memory dossier (read and edit)
    web: done
    mobile: done
    core: [vault]
    web_paths: ["clients/web/src/app/parent/kids/[id]/memory/page.tsx"]
    mobile_paths:
      - "clients/mobile/src/app/parent/kids/[id]/memory.tsx"

  - id: parent.personas
    area: parent
    title: Companion personas (soul documents)
    web: done
    mobile: done
    core: [vault]
    web_paths:
      - "clients/web/src/app/parent/personas/page.tsx"
      - "clients/web/src/app/parent/personas/new/page.tsx"
      - "clients/web/src/app/parent/personas/[id]/page.tsx"
    mobile_paths:
      - "clients/mobile/src/app/parent/personas/index.tsx"
      - "clients/mobile/src/app/parent/personas/new.tsx"
      - "clients/mobile/src/app/parent/personas/[id].tsx"

  - id: parent.games
    area: parent
    title: Game library, Discover, publishing and sharing
    web: done
    mobile: done
    core: [client-state, games]
    web_paths:
      - "clients/web/src/app/parent/games/page.tsx"
      - "clients/web/src/app/parent/games/[id]/page.tsx"
    mobile_paths:
      - "clients/mobile/src/app/parent/games/index.tsx"
      - "clients/mobile/src/app/parent/games/[id].tsx"
    notes: >-
      The app exports through the OS share sheet and imports with the document
      picker (the web downloads a file and uses a file input); row menus open as
      a bottom sheet.

  - id: parent.game-studio
    area: parent
    title: Game Studio (plan, build, edit, versions)
    web: done
    mobile: done
    core: [studio, ai, games, client-state]
    web_paths:
      - "clients/web/src/app/parent/game-studio/new/page.tsx"
      - "clients/web/src/app/parent/game-studio/[id]/[[...tab]]/page.tsx"
      - "clients/web/src/components/parent/games/game-studio.tsx"
    mobile_paths:
      - "clients/mobile/src/app/parent/game-studio/new.tsx"
      - "clients/mobile/src/app/parent/game-studio/[id]/index.tsx"
      - "clients/mobile/src/app/parent/game-studio/[id]/[tab].tsx"
      - "clients/mobile/src/components/studio/game-studio.tsx"
    notes: >-
      The app has the phone layout only. Its code view is read-only (no
      CodeMirror, so no manual code edits) and has no syntax highlighting.

  - id: parent.game-studio.resume
    area: parent
    title: Resume an interrupted build from its on-device checkpoint
    web: done
    mobile: done
    core: [studio, ai]
    web_paths:
      - "clients/web/src/lib/games/build-checkpoint-store.ts"
      - "clients/web/src/stores/studio-build-store.ts"
    mobile_paths:
      - "clients/mobile/src/adapters/checkpoint-store.ts"
      - "clients/mobile/src/lib/studio-build-store.ts"

  - id: parent.game-studio.background-build
    area: parent
    title: Builds keep running while the parent uses other apps
    web: n/a
    mobile: mobile-only
    core: [studio]
    mobile_paths:
      - "clients/mobile/modules/background-build/index.ts"
      - "clients/mobile/src/lib/background-build.tsx"
    notes: >-
      A browser tab can't run in the background. The web keeps builds alive
      across in-app navigation (BuildActivityHost) and resumes them after a
      reload instead.

  - id: parent.activities
    area: parent
    title: Activity feed
    web: done
    mobile: done
    web_paths: ["clients/web/src/app/parent/activities/page.tsx"]
    mobile_paths:
      - "clients/mobile/src/app/parent/activities.tsx"

  - id: parent.snapshots
    area: parent
    title: Snapshot gallery (parent)
    web: done
    mobile: done
    web_paths: ["clients/web/src/app/parent/snapshots/page.tsx"]
    mobile_paths:
      - "clients/mobile/src/app/parent/snapshots.tsx"
    notes: >-
      Export opens the OS share sheet, import the document picker.

  - id: parent.usage
    area: parent
    title: AI usage and dodi AI balance
    web: done
    mobile: done
    core: [client-state]
    web_paths: ["clients/web/src/app/parent/usage/page.tsx"]
    mobile_paths:
      - "clients/mobile/src/app/parent/usage.tsx"

  - id: parent.event-logs
    area: parent
    title: Event logs
    web: done
    mobile: done
    web_paths: ["clients/web/src/app/parent/event-logs/page.tsx"]

  # ----- Settings -------------------------------------------------------------
    mobile_paths:
      - "clients/mobile/src/app/parent/event-logs.tsx"

  - id: settings.general
    area: settings
    title: General settings (language, date format, interface)
    web: done
    mobile: done
    core: [intl, client-state]
    web_paths:
      - "clients/web/src/app/parent/settings/page.tsx"
      - "clients/web/src/app/parent/settings/general/page.tsx"
    mobile_paths:
      - "clients/mobile/src/app/parent/settings/index.tsx"
      - "clients/mobile/src/app/parent/settings/_layout.tsx"
      - "clients/mobile/src/app/parent/settings/general.tsx"

  - id: settings.security
    area: settings
    title: Security (password, account key, parent PIN)
    web: done
    mobile: done
    core: [client-state, vault]
    web_paths: ["clients/web/src/app/parent/settings/security/page.tsx"]
    mobile_paths:
      - "clients/mobile/src/app/parent/settings/security.tsx"

  - id: settings.devices
    area: settings
    title: Paired devices
    web: done
    mobile: done
    core: [client-state, vault]
    web_paths: ["clients/web/src/app/parent/settings/devices/page.tsx"]
    mobile_paths:
      - "clients/mobile/src/app/parent/settings/devices.tsx"

  - id: settings.ai-providers
    area: settings
    title: AI providers (BYOK keys, dodi AI, model per category)
    web: done
    mobile: done
    core: [client-state, ai]
    notes: >-
      Venice (OpenAI-compatible, text + image, no voice) is a BYOK provider
      and backs dodi AI's thinking, game and image categories; voice stays on
      xAI. Core-only change (registry + adapters), so both clients pick it up.
    web_paths: ["clients/web/src/app/parent/settings/ai-providers/page.tsx"]
    mobile_paths:
      - "clients/mobile/src/app/parent/settings/ai-providers.tsx"

  - id: settings.game-studio
    area: settings
    title: Game Studio settings (screenshot service)
    web: done
    mobile: done
    core: [client-state, games]
    web_paths: ["clients/web/src/app/parent/settings/game-studio/page.tsx"]
    mobile_paths: ["clients/mobile/src/app/parent/settings/game-studio.tsx"]

  - id: settings.notifications
    area: settings
    title: Email notification preferences
    web: done
    mobile: done
    core: [client-state]
    web_paths: ["clients/web/src/app/parent/settings/notifications/page.tsx"]

  # ----- Kid view -------------------------------------------------------------
    mobile_paths:
      - "clients/mobile/src/app/parent/settings/notifications.tsx"

  - id: kid.home
    area: kid
    title: Kid home with the companion
    web: done
    mobile: done
    core: [client-state]
    web_paths: ["clients/web/src/app/(kid)/home/page.tsx"]
    mobile_paths:
      - "clients/mobile/src/app/(kid)/home.tsx"
      - "clients/mobile/src/app/(kid)/_layout.tsx"

  - id: kid.games
    area: kid
    title: Kid game library and play (sandboxed)
    web: done
    mobile: done
    core: [client-state, games]
    web_paths:
      - "clients/web/src/app/(kid)/games/page.tsx"
      - "clients/web/src/app/(kid)/games/[id]/page.tsx"
    mobile_paths:
      - "clients/mobile/src/app/(kid)/games/index.tsx"
      - "clients/mobile/src/app/(kid)/games/[id].tsx"
    notes: >-
      The web's large-screen companion panel (DodiFullGame) has no phone
      layout; the app drives the companion from the chrome, as the web does on
      phones.

  - id: kid.friends
    area: kid
    title: Friends (E2EE friend cards)
    web: done
    mobile: done
    core: [protocol, vault]
    web_paths: ["clients/web/src/app/(kid)/friends/page.tsx"]
    mobile_paths:
      - "clients/mobile/src/app/(kid)/friends.tsx"

  - id: kid.snapshots
    area: kid
    title: Snapshots (kid view, replay)
    web: done
    mobile: done
    web_paths:
      - "clients/web/src/app/(kid)/snapshots/page.tsx"
      - "clients/web/src/app/(kid)/snapshots/[id]/page.tsx"
    mobile_paths:
      - "clients/mobile/src/app/(kid)/snapshots/index.tsx"
      - "clients/mobile/src/app/(kid)/snapshots/[id].tsx"

  - id: kid.voice
    area: kid
    title: Voice conversation with the companion
    web: done
    mobile: done
    core: [ai, client-state]
    web_paths: ["clients/web/src/stores/dodi-session-store.ts"]
    mobile_paths:
      - "clients/mobile/src/lib/dodi-session-store.ts"
      - "clients/mobile/src/adapters/audio-port.ts"
    notes: >-
      The app talks only while it is in the foreground (backgrounding ends the
      session). Echo cancellation: iOS voice processing on the audio engine and
      Android's VoiceCommunication input (patches/react-native-audio-api).
      The web's large-screen game panel (DodiFullGame) has no phone layout, so
      the app doesn't show it.

  - id: kid.character-3d
    area: kid
    title: Animated 3D companion
    web: done
    mobile: done
    core: [character]
    web_paths: ["clients/web/src/components/dodi/dodi-character-3d.tsx"]
    mobile_paths: ["clients/mobile/src/components/dodi/character-3d.tsx"]
    notes: >-
      The app renders with expo-gl (no supersampling, no pinch zoom) and falls
      back to an inverted-hull outline where the edge pass can't run.

  - id: kid.offline
    area: kid
    title: Offline kid view (cached ciphertext, autosave outbox)
    web: done
    mobile: done
    core: [client-state]
    web_paths: ["clients/web/src/lib/offline/offline-cache.ts"]
    mobile_paths:
      - "clients/mobile/src/adapters/offline-cache.ts"
      - "clients/mobile/src/lib/snapshots.ts"
      - "clients/mobile/src/lib/play-sync.ts"

  # ----- Public / platform-specific ---------------------------------------------
  - id: public.game-page
    area: public
    title: Public game page (SEO landing for published games)
    web: done
    mobile: n/a
    web_paths: ["clients/web/src/app/[locale]/games/[id]/page.tsx"]
    notes: A crawlable web page; the app opens shared links in the in-app player instead.

  - id: mobile.notifications
    area: mobile
    title: Local notifications (build finished, build paused)
    web: n/a
    mobile: mobile-only
    mobile_paths: ["clients/mobile/src/lib/background-build.tsx"]
    notes: Browser notifications are out of scope; the web studio shows outcomes in place.

  - id: mobile.share-sheet
    area: mobile
    title: Native share sheet for public game links
    web: n/a
    mobile: mobile-only
    phase: 4
    notes: The web copies the link instead.

  - id: mobile.pull-to-refresh
    area: mobile
    title: Pull to refresh on the scrolling parent pages and kid view pages
    web: n/a
    mobile: mobile-only
    core: [client-state]
    mobile_paths:
      - "clients/mobile/src/lib/use-pull-to-refresh.ts"
      - "clients/mobile/src/lib/refresh-scope.tsx"
      - "clients/mobile/src/components/shared/refresh-control.tsx"
    notes: >-
      Browsers have their own reload. Native RefreshControl (engages only at
      the top of the scroll view) on ShellContent pages and the kid chrome's
      page; not on Game Studio, game play, snapshot replay, auth, dialogs or
      the drawer. Registry and kid home composite in
      @dodi/client-state/pull-refresh and kid-view.
