      Export opens the OS share sheet, import the document picker.

  - id: parent.usage
    area: parent
    title: AI usage and dodi AI balance
    web: done
    mobile: done
    core: [client-state]
    web_paths: ["clients/web/src/app/parent/usage/page.tsx"]
    mobile_paths:
      - "clients/mobile/src/app/parent/usage.tsx"

  - id: parent.feedback
    area: parent
    title: Give feedback (feature requests, bug reports, inappropriate content, other)
    web: done
    mobile: done
    core: [client-state, protocol, ui-recipes]
    web_paths:
      - "clients/web/src/components/parent/feedback-dialog.tsx"
      - "clients/web/src/components/parent/feedback-fields.tsx"
      - "clients/web/src/components/parent/feedback-button.tsx"
    mobile_paths:
      - "clients/mobile/src/components/parent/feedback-dialog.tsx"
      - "clients/mobile/src/components/parent/feedback-fields.tsx"
      - "clients/mobile/src/components/parent/feedback-button.tsx"
    notes: >-
      A dialog from the sidebar / drawer, and from a Discover game's "Report this game"
      (category inappropriate content, game attached), the in-app flagging Google Play
      (AI-generated content) and the App Store (UGC) require. POST /api/feedback into
      feedback_messages, emailed to SYSTEM_NOTIFICATION_EMAIL with Reply-To set to the
      account email, and handled in the ops console's Feedback inbox. One optional image
      (web: file picker or paste into the message; mobile: photo library), re-encoded on
      the device by prepareFeedbackImage to a JPEG of at most 2048 px (no EXIF), at most
      2 MiB; stored in feedback_message_images and attached to the operator email.

  - id: parent.event-logs
    area: parent
    title: Event logs
    web: done
    mobile: done
    web_paths: ["clients/web/src/app/parent/event-logs/page.tsx"]

  # ----- Settings -------------------------------------------------------------
    mobile_paths:
      - "clients/mobile/src/app/parent/event-logs.tsx"

  - id: settings.general
    area: settings
    title: General settings of the account (role, plan, interface, date format)
    web: done
    mobile: done
    core: [intl, client-state]
    web_paths:
      - "clients/web/src/app/parent/settings/page.tsx"
      - "clients/web/src/app/parent/settings/general/page.tsx"
    mobile_paths:
      - "clients/mobile/src/app/parent/settings/index.tsx"
      - "clients/mobile/src/app/parent/settings/_layout.tsx"
      - "clients/mobile/src/app/parent/settings/general.tsx"

  - id: settings.legal
    area: settings
    title: Legal links (privacy policy, terms, imprint) in General settings
    web: done
    mobile: done
    core: [client-state]
    web_paths: ["clients/web/src/components/parent/legal-links.tsx"]
    mobile_paths: ["clients/mobile/src/components/settings/legal-links.tsx"]
    notes: Pages live on the marketing site (dodi-com/landing); paths in core/client-state/src/legal-links.ts.

  - id: settings.delete-account
    area: settings
    title: Delete the account (owner, password re-check, erases all its data) or leave it (everyone else)
    web: done
    mobile: done
    core: [client-state]
    web_paths:
      - "clients/web/src/components/parent/delete-account.tsx"
      - "clients/web/src/components/parent/leave-account.tsx"
      - "clients/web/src/components/parent/password-confirm-dialog.tsx"
    mobile_paths:
      - "clients/mobile/src/components/settings/delete-account.tsx"
      - "clients/mobile/src/components/settings/leave-account.tsx"
      - "clients/mobile/src/components/settings/password-confirm-dialog.tsx"
    notes: >-
      Required by Google Play and the App Store, together with
      settings.profile (deleting the profile). DELETE /api/account
      (platform/src/services/account-deletion.ts) erases the account only;
      every profile stays and lands in another account or on the "no account"
      screen. Logic in core/client-state/src/account-deletion.ts.

  - id: settings.profile
    area: settings
    title: "Profile page (from the email at the foot of the menu): email, language, password, your accounts, delete profile"
    web: done
    mobile: done
    core: [client-state]
    notes: >-
      What belongs to the person rather than the account. Deleting the
      profile (DELETE /api/me) is refused while it owns an account; the "no
      account" screen offers it too. Every session ends, so the device signs
      out and is wiped.
    web_paths:
      - "clients/web/src/app/parent/profile/page.tsx"
      - "clients/web/src/components/parent/account-badge.tsx"
      - "clients/web/src/components/parent/profile/delete-profile.tsx"
      - "clients/web/src/lib/auth/end-session.ts"
    mobile_paths:
      - "clients/mobile/src/app/parent/profile.tsx"
      - "clients/mobile/src/components/parent/account-badge.tsx"
      - "clients/mobile/src/components/profile/delete-profile.tsx"
      - "clients/mobile/src/adapters/device-wipe.ts"

  - id: settings.security
    area: settings
    title: Security (the account's parent PIN; the password is on the profile page)
    web: done
    mobile: done
    core: [client-state, vault]
    web_paths: ["clients/web/src/app/parent/settings/security/page.tsx"]
    mobile_paths:
      - "clients/mobile/src/app/parent/settings/security.tsx"

  - id: settings.access
    area: settings
    title: "Access: the browsers, app, robot, agents and access keys that can open the vault, with one-step revoke"
    web: done
    mobile: done
    core: [client-state, protocol, vault]
    notes: >-
      One list from GET /api/authorized-clients, grouped by groupAccess (this
      device, browsers and apps, robot, agents). Revoking this client signs it
      out. "Connect a robot" / "Connect an agent" open parent.authorize; access
      keys are created here after the account password. The old Devices and
      Agents pages redirect here (an old ?code= link to /parent/authorize).
      Logic in core/client-state/src/authorized-clients.ts.
    web_paths:
      - "clients/web/src/app/parent/settings/access/page.tsx"
      - "clients/web/src/app/parent/settings/devices/page.tsx"
      - "clients/web/src/app/parent/settings/agents/page.tsx"
    mobile_paths:
      - "clients/mobile/src/app/parent/settings/access.tsx"

  - id: parent.authorize
    area: parent
    title: Allow access (approve a robot or agent from its code, with the account password)
    web: done
    mobile: done
    core: [client-state, protocol, vault]
    notes: >-
      Robots and the dodi CLI print <app>/authorize?code=...; that short path
      redirects to /parent/authorize (behind the vault and PIN gates), and the
      web middleware keeps ?code= through login. The card shows name and
      fingerprint, and for an agent the scopes (kids:memory off by default) and
      expiry. Before the vault key is wrapped, the device's signature binding
      its KEM key to the fingerprinted signing key is verified (agents must
      send it; an unsigned robot may still pair).
    web_paths:
      - "clients/web/src/app/parent/authorize/page.tsx"
      - "clients/web/src/app/authorize/page.tsx"
    mobile_paths:
      - "clients/mobile/src/app/parent/authorize.tsx"
      - "clients/mobile/src/app/authorize.tsx"

  - id: settings.family-members
    area: settings
    title: "Account members: invite other adults (co-parent or limited), change their access, remove, leave"
    web: done
    mobile: done
    core: [client-state, protocol, vault]
    notes: >-
      The People section of Settings > Access. Inviting seals the family's key
      under a one-time link secret (in the #fragment); the inviter sends the
      link themselves (mail app, share sheet, copy), so the platform never
      sees it. Limited members get agent-style scopes and no kid view or
      family settings; the parent area hides what they may not open
      (core/client-state/src/parent-nav.ts). Logic in
      core/client-state/src/family-members.ts, crypto in core/vault/src/member-keys.ts.
    web_paths:
      - "clients/web/src/components/parent/access/people-section.tsx"
      - "clients/web/src/components/parent/access/invite-dialog.tsx"
      - "clients/web/src/components/parent/access/member-access-dialog.tsx"
      - "clients/web/src/components/parent/parent-access-guard.tsx"
    mobile_paths:
      - "clients/mobile/src/components/parent/access/people-section.tsx"
      - "clients/mobile/src/components/parent/access/invite-dialog.tsx"
      - "clients/mobile/src/components/parent/access/member-access-dialog.tsx"
      - "clients/mobile/src/components/parent/parent-access-guard.tsx"

  - id: auth.join-family
    area: auth
    title: Join an account from an invitation link (new profile or existing one, email code, own key)
    web: done
    mobile: done
    core: [client-state, vault]
    notes: >-
      /join/{id}#k={secret}. The invited address signs up (no family of its
      own) or signs in, confirms the address with the emailed code, and the
      password seals the person's own key; the family's key is wrapped to it.
      Nobody else has to be online. Public route (web middleware). The app
      route sits outside (auth) (that layout redirects signed-in users); invite
      links (https://app.dodi.app/join/...) open the web until the app gets
      universal/app links for /join/*.
    web_paths:
      - "clients/web/src/app/(auth)/join/[id]/page.tsx"
      - "clients/web/src/components/auth/join/join-family.tsx"
    mobile_paths:
      - "clients/mobile/src/app/join/[id].tsx"

  - id: settings.family-switch
    area: settings
    title: Switch between accounts and create one of your own (a profile in several accounts)
    web: done
    mobile: done
    core: [client-state]
    notes: >-
      Profile > Your accounts, and the "no account" screen of the vault gate
      (left, removed, or the account was deleted). Switching drops the
      device's caches of the old account (ClientState.dropFamilyData).
    web_paths:
      - "clients/web/src/components/parent/profile/account-switcher.tsx"
      - "clients/web/src/components/vault/no-family-notice.tsx"
    mobile_paths:
      - "clients/mobile/src/components/profile/account-switcher.tsx"
      - "clients/mobile/src/components/vault/no-family-notice.tsx"

  - id: settings.ai-providers
    area: settings
    title: AI providers (BYOK keys, dodi AI, model per category)
    web: done
    mobile: done
    core: [client-state, ai]
    notes: >-
      Venice (OpenAI-compatible, text + image, no voice) is a BYOK provider
      and backs dodi AI's thinking, game and image categories; voice stays on
      xAI. Core-only change (registry + adapters), so both clients pick it up.
      Open beta: dodi AI is switched off (IS_DODI_AI_OFFERED in
      core/client-state/src/dodi-ai.ts), so both clients show own keys only,
      untabbed, as in self-host mode.
    web_paths: ["clients/web/src/app/parent/settings/ai-providers/page.tsx"]
    mobile_paths:
      - "clients/mobile/src/app/parent/settings/ai-providers.tsx"

  - id: settings.game-studio
    area: settings
    title: Game Studio settings (screenshot service)
    web: done
    mobile: done
    core: [client-state, games]
    web_paths: ["clients/web/src/app/parent/settings/game-studio/page.tsx"]
    mobile_paths: ["clients/mobile/src/app/parent/settings/game-studio.tsx"]

  - id: settings.notifications
    area: settings
    title: Email notification preferences
    web: done
    mobile: done
    core: [client-state]
    web_paths: ["clients/web/src/app/parent/settings/notifications/page.tsx"]

  # ----- Kid view -------------------------------------------------------------
    mobile_paths:
      - "clients/mobile/src/app/parent/settings/notifications.tsx"

