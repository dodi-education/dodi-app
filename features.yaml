      - "clients/mobile/src/lib/dodi-session-store.ts"
      - "clients/mobile/src/adapters/audio-port.ts"
      - "clients/mobile/src/components/kid/companion-hearing-toggle.tsx"
    notes: >-
      On the kid home, a header button beside the volume control toggles deaf
      mode (listening on/off), next to tapping the companion. The app talks only while it is in
      the foreground (backgrounding ends the session). Echo cancellation: iOS voice processing on the audio engine and
      Android's VoiceCommunication input (patches/react-native-audio-api).
      The web's large-screen game panel (DodiFullGame) has no phone layout, so
      the app doesn't show it.

  - id: kid.character-3d
    area: kid
    title: Animated 3D companion
    web: done
    mobile: done
    core: [character]
    web_paths: ["clients/web/src/components/dodi/dodi-character-3d.tsx"]
    mobile_paths: ["clients/mobile/src/components/dodi/character-3d.tsx"]
    notes: >-
      The app renders with expo-gl (no supersampling, no pinch zoom) and falls
      back to an inverted-hull outline where the edge pass can't run.

  - id: kid.playground
    area: kid
    title: Playground on kid home (companion look, accessories, avatar, tricks)
    web: done
    mobile: done
    core: [client-state, character, ui-recipes]
    web_paths:
      - "clients/web/src/components/kid/playground/playground.tsx"
      - "clients/web/src/components/kid/playground/look-panel.tsx"
      - "clients/web/src/components/kid/playground/tricks-panel.tsx"
      - "clients/web/src/components/kid/playground/companion-switcher.tsx"
    mobile_paths:
      - "clients/mobile/src/components/kid/playground/playground.tsx"
      - "clients/mobile/src/components/kid/playground/look-panel.tsx"
      - "clients/mobile/src/components/kid/playground/tricks-panel.tsx"
      - "clients/mobile/src/components/kid/playground/companion-switcher.tsx"
    notes: >-
      The tools open as a bottom panel at phone width on both clients; Android's
      back button closes it on the app (the web's Escape).

  - id: kid.custom-tricks
    area: kid
    title: Teach the companion a trick (AI-written motion, kept per companion)
    web: done
    mobile: done
    core: [client-state, character, ai]
    web_paths: ["clients/web/src/components/kid/playground/teach-trick-panel.tsx"]
    mobile_paths: ["clients/mobile/src/components/kid/playground/teach-trick-panel.tsx"]

  - id: companions.custom-assets
    area: kid
    title: The family's own avatars and accessories (made with the dodi CLI, E2EE), worn in the Playground; parents delete them under Companions
    web: done
    mobile: done
    core: [character, client-state, vault, types]
    web_paths:
      - "clients/web/src/components/parent/character-asset-list.tsx"
      - "clients/web/src/hooks/use-worn-look.ts"
      - "clients/web/src/stores/character-asset-store.ts"
    mobile_paths:
      - "clients/mobile/src/components/parent/character-asset-list.tsx"
      - "clients/mobile/src/lib/use-worn-look.ts"
    notes: >-
      No upload in the apps yet: assets come from the CLI. Custom avatars offer
      no recolorable parts. Sharing them on Discover and adding other families'
      ones is parent.discover-character-assets.

