  - id: parent.companions
    area: parent
    title: Companions per kid (name, persona, active one) and personas (soul documents)
    web: done
    mobile: done
    core: [client-state, vault]
    web_paths:
      - "clients/web/src/app/parent/companions/page.tsx"
      - "clients/web/src/app/parent/companions/new/page.tsx"
      - "clients/web/src/app/parent/companions/[id]/page.tsx"
      - "clients/web/src/app/parent/companions/personas/new/page.tsx"
      - "clients/web/src/app/parent/companions/personas/[id]/page.tsx"
      - "clients/web/src/app/parent/personas/page.tsx"
      - "clients/web/src/app/parent/personas/new/page.tsx"
      - "clients/web/src/app/parent/personas/[id]/page.tsx"
    mobile_paths:
      - "clients/mobile/src/app/parent/companions/index.tsx"
      - "clients/mobile/src/app/parent/companions/new.tsx"
      - "clients/mobile/src/app/parent/companions/[id].tsx"
      - "clients/mobile/src/app/parent/companions/personas/new.tsx"
      - "clients/mobile/src/app/parent/companions/personas/[id].tsx"
      - "clients/mobile/src/app/parent/personas/index.tsx"
      - "clients/mobile/src/app/parent/personas/new.tsx"
      - "clients/mobile/src/app/parent/personas/[id].tsx"
    notes: >-
      The old /parent/personas routes are redirects to their new place under
      Companions, kept for links and bookmarks.

  - id: parent.games
    area: parent
    title: Game library, Discover, publishing and sharing
    web: done
    mobile: done
    core: [client-state, games]
    web_paths:
      - "clients/web/src/app/parent/games/page.tsx"
      - "clients/web/src/app/parent/games/[id]/page.tsx"
    mobile_paths:
      - "clients/mobile/src/app/parent/games/index.tsx"
      - "clients/mobile/src/app/parent/games/[id].tsx"
    notes: >-
      The app exports through the OS share sheet and imports with the document
      picker (the web downloads a file and uses a file input); row menus open as
      a bottom sheet.

  - id: parent.discover-character-assets
    area: parent
    title: Discover for avatars and accessories (share your own for review, add other families' ones)
    web: done
    mobile: done
    core: [client-state, vault, ui-recipes, intl]
    web_paths:
      - "clients/web/src/components/parent/discover-asset-list.tsx"
      - "clients/web/src/components/parent/character-asset-share-dialog.tsx"
      - "clients/web/src/components/parent/character-asset-share-fields.tsx"
      - "clients/web/src/stores/discover-asset-store.ts"
    mobile_paths:
      - "clients/mobile/src/components/parent/discover-asset-list.tsx"
      - "clients/mobile/src/components/parent/character-asset-share-dialog.tsx"
      - "clients/mobile/src/components/parent/character-asset-share-fields.tsx"
    notes: >-
      Sharing posts a plaintext copy of the opened file for human review (no
      preview image yet: cards show the kind's icon). Added assets are
      play-in-place: the family's asset store lists them next to its own and
      the Companions list removes them.

  - id: parent.game-studio
    area: parent
    title: Game Studio (plan, build, edit, versions)
    web: done
    mobile: done
    core: [studio, ai, games, client-state]
    web_paths:
      - "clients/web/src/app/parent/game-studio/new/page.tsx"
      - "clients/web/src/app/parent/game-studio/[id]/[[...tab]]/page.tsx"
      - "clients/web/src/components/parent/games/game-studio.tsx"
    mobile_paths:
      - "clients/mobile/src/app/parent/game-studio/new.tsx"
      - "clients/mobile/src/app/parent/game-studio/[id]/index.tsx"
      - "clients/mobile/src/app/parent/game-studio/[id]/[tab].tsx"
      - "clients/mobile/src/components/studio/game-studio.tsx"
    notes: >-
      The app has the phone layout only. Its code view is read-only (no
      CodeMirror, so no manual code edits) and has no syntax highlighting.
      The composer's grip resizes the input on both clients; the phone layout
      starts at half the desktop height and remembers its own size
      (core: studio/composer-height).

  - id: parent.game-studio.resume
    area: parent
    title: Resume an interrupted build from its on-device checkpoint
    web: done
    mobile: done
    core: [studio, ai]
    web_paths:
      - "clients/web/src/lib/games/build-checkpoint-store.ts"
      - "clients/web/src/stores/studio-build-store.ts"
    mobile_paths:
      - "clients/mobile/src/adapters/checkpoint-store.ts"
      - "clients/mobile/src/lib/studio-build-store.ts"

  - id: parent.game-studio.background-build
    area: parent
    title: Builds keep running while the parent uses other apps
    web: n/a
    mobile: mobile-only
    core: [studio]
    mobile_paths:
      - "clients/mobile/modules/background-build/index.ts"
      - "clients/mobile/src/lib/background-build.tsx"
    notes: >-
      A browser tab can't run in the background. The web keeps builds alive
      across in-app navigation (BuildActivityHost) and resumes them after a
      reload instead.

  - id: parent.activities
    area: parent
    title: Activity feed
    web: done
    mobile: done
    web_paths: ["clients/web/src/app/parent/activities/page.tsx"]
    mobile_paths:
      - "clients/mobile/src/app/parent/activities.tsx"

  - id: parent.snapshots
    area: parent
    title: Snapshot gallery (parent)
    web: done
    mobile: done
